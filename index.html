<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🍔 냠냠! 햄버거 폭우 - WEMADE PLAY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #140a26; color: #fff; user-select: none;
  }
  .logo {
    height: 34px; width: auto; margin-bottom: 10px;
    background: #fff; padding: 8px 16px; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  h1 { font-size: 24px; margin-bottom: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .subtitle { color: #b9a9dd; font-size: 13px; margin-bottom: 12px; }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #stage.tap #video, #stage.tap #shirtLogo { display: none; }
  #stage.tap { background: radial-gradient(circle at 50% 30%, #3a2a5a, #140a26 70%); }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video { transform: scaleX(-1); }

  /* 떨어지는 햄버거 */
  .drop {
    position: absolute;
    font-size: 38px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.6));
    z-index: 5; pointer-events: none;
    transition: filter .1s;
    will-change: top, left;
  }
  .drop.hot { filter: drop-shadow(0 0 12px #ffe66d) drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .drop.gold { animation: sparkle .8s ease-in-out infinite; }
  .drop.gold.hot { filter: drop-shadow(0 0 16px #ffd93d) drop-shadow(0 0 6px #fff); }
  @keyframes sparkle {
    0%,100% { filter: drop-shadow(0 0 8px #ffd93d); }
    50%     { filter: drop-shadow(0 0 18px #fff) drop-shadow(0 0 8px #ffd93d); }
  }
  .drop.eaten { animation: eat .35s ease forwards; }
  @keyframes eat {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    40%  { transform: translate(-50%, -50%) scale(1.6) rotate(-12deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(.2); opacity: 0; }
  }

  /* 화면 흔들림 */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }
  #stage.shake { animation: shake .3s; }

  /* 콤보 표시 */
  #comboPill {
    background: linear-gradient(90deg,#ff6b6b,#ffb347);
    color: #201035; transition: transform .12s;
  }
  #comboPill.bump { transform: scale(1.35); }
  #comboPill.off { opacity: 0; }

  /* 입 높이 띠(먹는 구간) */
  #band {
    position: absolute; left: 0; right: 0;
    top: 42%; height: 20%;
    background: linear-gradient(180deg, rgba(255,230,109,.08), rgba(255,107,107,.14), rgba(255,230,109,.08));
    border-top: 2px dashed rgba(255,255,255,.35);
    border-bottom: 2px dashed rgba(255,255,255,.35);
    z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #band span { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.7); text-shadow: 0 1px 3px #000; }

  /* 티셔츠에 프린트된 로고 (흰 배경은 multiply로 날림) */
  #shirtLogo {
    position: absolute; left: 50%; top: 76%;
    width: 40%;
    transform: translate(-50%, -50%);
    mix-blend-mode: multiply;
    opacity: .95; filter: contrast(1.15);
    z-index: 3; pointer-events: none;
  }

  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 18px; font-weight: 800;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    z-index: 6; pointer-events: none;
  }
  .pill { background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 999px; }

  .float {
    position: absolute; z-index: 7; font-weight: 900;
    color: #ffe66d; text-shadow: 0 2px 8px rgba(0,0,0,.8);
    pointer-events: none; animation: floatUp 1s ease-out forwards;
    left: 50%; top: 50%; transform: translate(-50%,-50%); white-space: nowrap;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%,-50%) scale(.6); opacity: 0; }
    25%  { transform: translate(-50%,-90%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-180%) scale(1); opacity: 0; }
  }

  #overlayMsg {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(18,9,36,.97); text-align: center; gap: 12px; padding: 20px; overflow-y: auto;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #overlayMsg .logo { height: 28px; margin-bottom: 2px; }
  #overlayMsg h2 { font-size: 34px; }
  #overlayMsg p { color: #cdbdf0; max-width: 440px; line-height: 1.6; }

  /* HOW TO PLAY 카드 */
  .howcard {
    width: 92%; max-width: 400px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 16px 18px;
  }
  .how-title {
    font-size: 12px; font-weight: 800; letter-spacing: 2.5px;
    color: #ffb347; text-align: center; margin-bottom: 14px;
  }
  .how-step { display: flex; align-items: center; gap: 12px; text-align: left; }
  .how-step + .how-step { margin-top: 11px; }
  .how-step .ic {
    flex: 0 0 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(135deg, rgba(255,107,107,.25), rgba(255,179,71,.25));
  }
  .how-step .tx { font-size: 13.5px; color: #e8dcff; line-height: 1.45; }
  .how-step .tx b { color: #fff; }
  .rules { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 15px; }
  .rule { font-size: 12.5px; font-weight: 800; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.07); }
  .rule.good { color: #7bed9f; } .rule.bad { color: #ff8080; }
  .rule.star { color: #ffd93d; } .rule.combo { color: #ffb347; }
  button {
    background: linear-gradient(90deg,#ff6b6b,#ffb347);
    color: #201035; border: none; font-weight: 800; font-size: 18px;
    padding: 14px 34px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,107,107,.4);
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }
  .hidden { display: none !important; }
  .camtab {
    display: inline-block; margin-top: 2px;
    font-size: 13.5px; font-weight: 700; color: #ffd93d;
    background: rgba(255,217,61,.12); border: 1px solid rgba(255,217,61,.45);
    padding: 9px 18px; border-radius: 999px; text-decoration: none;
  }
  .camtab:active { transform: scale(.96); }

  /* 점수 연출 */
  #scorePill { transition: transform .13s, background .13s; }
  #scorePill.bump { transform: scale(1.32); }
  #scorePill.gain { background: rgba(46,204,113,.85) !important; }
  #scorePill.loss { background: rgba(255,59,48,.85) !important; }
  .flyscore {
    position: absolute; z-index: 8; font-weight: 900; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); will-change: transform, opacity;
  }

  /* 피버 게이지 & 피버 타임 */
  #feverWrap {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    width: 170px; height: 18px; background: rgba(0,0,0,.5);
    border: 1.5px solid rgba(255,255,255,.22);
    border-radius: 999px; overflow: hidden; z-index: 6; pointer-events: none;
  }
  #fever { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd93d,#ff8c42,#ff6b6b); transition: width .2s; }
  #feverWrap .flabel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; letter-spacing: 2.5px;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  #feverWrap.full { border-color: #ffd93d; animation: gaugeGlow .45s infinite alternate; }
  @keyframes gaugeGlow { from { box-shadow: 0 0 5px #ffd93d; } to { box-shadow: 0 0 18px #ffd93d; } }

  /* 🔥 피버 타임 대문짝 배너 */
  #feverBanner {
    position: absolute; left: 50%; top: 36%;
    transform: translate(-50%,-50%);
    font-size: clamp(44px, 10vw, 120px); font-weight: 900;
    white-space: nowrap; z-index: 9; pointer-events: none; opacity: 0;
    color: #ffd93d;
    -webkit-text-stroke: 3px #a52310;
    paint-order: stroke fill;
    text-shadow: 0 0 34px #ff6b6b, 0 8px 0 #7a1500, 0 12px 24px rgba(0,0,0,.6);
  }
  #feverBanner.show { animation: feverSlam 1.8s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes feverSlam {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(3.2) rotate(-8deg); }
    16%  { opacity: 1; transform: translate(-50%,-50%) scale(1)   rotate(2deg);  }
    28%  { transform: translate(-50%,-50%) scale(1.12) rotate(-1.5deg); }
    40%  { transform: translate(-50%,-50%) scale(1.04) rotate(0.5deg); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25); }
  }
  #stage.fever::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(180deg, rgba(255,107,107,.20), rgba(255,217,61,.14));
    animation: feverPulse .45s ease-in-out infinite alternate;
  }
  @keyframes feverPulse { from { opacity: .35; } to { opacity: 1; } }

  /* 막판 러시: 타이머 고동 */
  .pill.hot { background: #ff3b30 !important; animation: timePulse .5s infinite alternate; }
  @keyframes timePulse { from { transform: scale(1); } to { transform: scale(1.18); } }

  /* 폭탄 */
  .drop.bomb { animation: bombGlow .7s ease-in-out infinite alternate; }
  @keyframes bombGlow {
    from { filter: drop-shadow(0 0 6px #ff3b30) drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
    to   { filter: drop-shadow(0 0 16px #ff3b30) drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  }
  .tips { font-size: 13px; color: #9a89c4; margin-top: 16px; text-align: center; }

  /* 📱 모바일 최적화 */
  @media (max-width: 640px) {
    body { padding: 8px; justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top)); }
    .logo { height: 26px; margin-bottom: 6px; }
    h1 { font-size: 20px; }
    .subtitle { font-size: 12px; margin-bottom: 8px; padding: 0 8px; }
    #shirtLogo { width: 55%; top: 78%; }
    .drop { font-size: 32px; }
    .hud { font-size: 15px; }
    .pill { padding: 5px 11px; }
    #band span { font-size: 11px; }
    #overlayMsg h2 { font-size: 30px; }
    #overlayMsg p { font-size: 14px; }
    .tips { font-size: 11px; margin-top: 10px; }
  }
  /* 스크롤/당겨서 새로고침 방지 (게임 중 오작동 방지) */
  html, body { overscroll-behavior: none; touch-action: manipulation; }
</style>
</head>

<script>
const video   = document.getElementById('video');
const stage   = document.getElementById('stage');
const bandEl  = document.getElementById('band');
const scoreEl = document.getElementById('score');
const timeEl  = document.getElementById('time');
const comboEl = document.getElementById('comboPill');
const feverEl = document.getElementById('fever');
const scorePill = document.getElementById('scorePill');
const feverWrap = document.getElementById('feverWrap');
const feverBanner = document.getElementById('feverBanner');
const timePill= document.getElementById('timePill');
const overlay = document.getElementById('overlayMsg');
const startBtn= document.getElementById('startBtn');

const BURGERS = ['🍔','🍔','🍔','🍔','🍔','🍔','🍔','🍟','🌭','🍕','🌮'];
const BAND_TOP = 42, BAND_BOT = 62;   // 먹는 구간(%)

let stream = null, running = false;
let score = 0, timeLeft = 30;
let cooldown = 0, frame = 0;
let streak = 0, bestStreak = 0;
let fever = 0, feverUntil = 0;   // 피버 게이지(0~100) / 피버 종료 시각
let drops = [];   // {el, x, y, vy, eaten, type}
let tapMode = false;   // 카메라 불가(iframe 권한 없음/거부) 시 스페이스바/탭으로 플레이
let camBlockReason = '';
let camPolicyBlocked = false;
let armed = true;                         // 입을 다물었다 벌리는 순간만 '한 입' 발동
const JAW_OPEN = 0.3, JAW_CLOSED = 0.15;  // 입 벌림 판정 임계값 (0~1) — 낮을수록 민감

// 효과음 (Web Audio로 즉석 생성)
let actx = null;
function sfx(type) {
  if (!actx) return;
  const t = actx.currentTime;
  const beep = (freq, f2, dur, wave, vol) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  if (type === 'chomp') beep(200, 70, 0.13, 'square', 0.22);
  else if (type === 'coin') { beep(880, null, 0.08, 'triangle', 0.2); setTimeout(()=>actx&&beep(1320,null,0.12,'triangle',0.18), 60); }
  else if (type === 'bad')  beep(150, 45, 0.32, 'sawtooth', 0.25);
  else if (type === 'star') [660,880,1100,1320].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain(), st=t+i*0.05;
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.18, st); g.gain.exponentialRampToValueAtTime(0.001, st+0.16);
    o.connect(g).connect(actx.destination); o.start(st); o.stop(st+0.18);
  });
}
function shake() { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }

// 점수 연출: 날아가는 점수 + 점수판 펀치 + 숫자 롤링
let shownScore = 0, scoreTween = 0;
function scoreFX(delta) {
  if (delta === 0) return;
  const up = delta > 0;
  // ① 먹은 자리에서 점수판으로 날아가는 숫자
  try {
    const fly = document.createElement('div');
    fly.className = 'flyscore';
    fly.textContent = (up ? '+' : '') + delta;
    fly.style.color = up ? '#7bed9f' : '#ff8080';
    fly.style.fontSize = Math.min(48, 24 + Math.abs(delta) * 2.5) + 'px';
    const stR = stage.getBoundingClientRect(), pR = scorePill.getBoundingClientRect();
    const sx = stR.width * (0.42 + Math.random() * 0.16), sy = stR.height * 0.52;
    const ex = pR.left - stR.left + pR.width / 2, ey = pR.top - stR.top + pR.height / 2;
    fly.style.left = sx + 'px'; fly.style.top = sy + 'px';
    stage.appendChild(fly);
    fly.animate([
      { transform: 'translate(-50%,-50%) scale(1.35)', opacity: 1 },
      { transform: 'translate(-50%,-50%) scale(1.35)', opacity: 1, offset: 0.25 },
      { transform: `translate(calc(-50% + ${ex - sx}px), calc(-50% + ${ey - sy}px)) scale(.45)`, opacity: .2 }
    ], { duration: 700, easing: 'cubic-bezier(.3,.6,.3,1)' }).onfinish = () => fly.remove();
    setTimeout(() => fly.remove(), 900);   // 안전망
  } catch (e) {}
  // ② 점수판 펀치 + 색 번쩍 (숫자 도착 타이밍에)
  setTimeout(() => {
    scorePill.classList.add('bump', up ? 'gain' : 'loss');
    setTimeout(() => scorePill.classList.remove('bump', 'gain', 'loss'), 320);
  }, 560);
  // ③ 숫자 롤링 (촤라락)
  const from = shownScore, to = score, t0 = performance.now(), dur = 450, id = ++scoreTween;
  (function step(t) {
    if (id !== scoreTween) return;
    const k = Math.min(1, (t - t0) / dur);
    shownScore = Math.round(from + (to - from) * k);
    scoreEl.textContent = shownScore;
    if (k < 1) requestAnimationFrame(step); else shownScore = to;
  })(t0);
  setTimeout(() => { if (id === scoreTween) { shownScore = to; scoreEl.textContent = to; } }, dur + 150);  // rAF 정지 대비
}
function updateCombo() {
  const mult = multiplier();
  comboEl.textContent = '🔥 x' + mult;
  comboEl.classList.toggle('off', streak < 1);
  comboEl.classList.add('bump');
  setTimeout(() => comboEl.classList.remove('bump'), 130);
}
function multiplier() { return Math.min(5, 1 + Math.floor(Math.max(0, streak - 1) / 2)); } // 1,1,2,2,3,3,4,4,5

// 모션 감지
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });
const W = 64, H = 48; proc.width = W; proc.height = H;
let prevFrame = null;

async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play(); return true;
  } catch (e) {
    // 카메라 불가 → 탭/스페이스 모드로 전환해 계속 진행
    // (iframe에 allow="camera"가 없으면 NotAllowedError가 즉시 발생)
    tapMode = true;
    camBlockReason = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
      ? 'iframe/브라우저에서 카메라가 차단됨' : '카메라를 찾을 수 없음';
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') && window.self !== window.top) {
      camPolicyBlocked = true;
      const a = document.getElementById('camTabBtn');
      if (a) { a.href = location.href; a.classList.remove('hidden'); }
    }
    stage.classList.add('tap');
    return true;
  }
}

function motionInCenter() {
  pctx.save(); pctx.scale(-1, 1); pctx.drawImage(video, -W, 0, W, H); pctx.restore();
  const cur = pctx.getImageData(0, 0, W, H).data;
  if (!prevFrame) { prevFrame = cur.slice(); return 0; }
  const x0 = W*0.28|0, x1 = W*0.72|0, y0 = H*0.30|0, y1 = H*0.80|0;
  let diff = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = (y*W + x) * 4;
    diff += Math.abs(cur[i]-prevFrame[i]) + Math.abs(cur[i+1]-prevFrame[i+1]) + Math.abs(cur[i+2]-prevFrame[i+2]);
  }
  prevFrame = cur.slice();
  return diff / ((x1-x0)*(y1-y0));
}

function popText(txt, big, bad) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.fontSize = big ? '40px' : '26px';
  el.style.color = bad ? '#ff6b6b' : '#ffe66d';
  el.style.top = (30 + Math.random()*10) + '%';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function spawnDrop() {
  const el = document.createElement('div');
  el.className = 'drop';
  let type;
  const feverOn = performance.now() < feverUntil;
  if (feverOn) { el.textContent = '🍔'; type = 'good'; }                                          // 피버: 햄버거만!
  else if (Math.random() < 0.06) { el.textContent = '💣'; el.classList.add('bomb'); type = 'bomb'; } // 폭탄 조심!
  else if (Math.random() < 0.07) { el.textContent = '⭐'; el.classList.add('gold'); type = 'gold'; } // 황금 별 보너스
  else { const e = BURGERS[Math.random()*BURGERS.length|0]; el.textContent = e; type = (e === '🍔') ? 'good' : 'bad'; }
  const x = 8 + Math.random()*84;        // 좌우 위치 %
  el.style.left = x + '%';
  el.style.top = '-8%';
  stage.appendChild(el);
  drops.push({ el, x, y: -8, vy: 0.32 + Math.random()*0.34, eaten: false, type });
}

function chomp() {
  // 띠 안에 있는(아직 안 먹은) 음식을 전부 먹기 — 🍔 +, ⭐ 보너스, 나머지 -
  const s0 = score;
  let good = 0, bad = 0, gold = 0, bombs = 0;
  for (const d of drops) {
    if (!d.eaten && d.y >= BAND_TOP && d.y <= BAND_BOT) {
      d.eaten = true;
      if (d.type === 'good') good++;
      else if (d.type === 'gold') gold++;
      else if (d.type === 'bomb') bombs++;
      else bad++;
      d.el.classList.add('eaten');
      setTimeout(() => d.el.remove(), 350);
    }
  }
  if (good === 0 && bad === 0 && gold === 0 && bombs === 0) return;

  const base = good + gold * 5;   // 별은 5점짜리

  // 피버 게이지 충전 (피버 중엔 충전 안 함)
  if (performance.now() >= feverUntil) {
    fever = Math.min(100, fever + good * 12 + gold * 25);
    if (fever >= 100) {
      feverUntil = performance.now() + 6000;   // 🔥 6초 피버 타임!
      fever = 0;
      sfx('star'); shake();
      feverBanner.classList.remove('show'); void feverBanner.offsetWidth;
      feverBanner.classList.add('show');
    }
  }

  if (bombs > 0) {
    // 💣 폭탄! 큰 감점 + 콤보 리셋
    streak = 0;
    score += base - bad - bombs * 3;
    sfx('bad'); shake(); updateCombo();
    popText('💣 -' + (bad + bombs * 3) + '!! 콤보 터짐!', true, true);
  } else if (bad > 0) {
    // 실수! 콤보 리셋 + 감점
    streak = 0;
    score += base - bad;
    sfx('bad'); shake(); updateCombo();
    if (good === 0 && gold === 0) popText('-' + bad + ' 🤢 우엑!', true, true);
    else                          popText('+' + base + '  -' + bad + ' 😵', true, bad >= base);
  } else {
    // 성공! 콤보 상승 → 배수 적용
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    const mult = multiplier();
    const gained = base * mult;
    score += gained;
    updateCombo();
    if (gold > 0) { sfx('star'); shake(); popText('⭐ +' + gained + ' 보너스!', true); }
    else {
      sfx('chomp'); if (mult >= 2) sfx('coin');
      if (mult >= 3 || good >= 3) { shake(); popText(good + '개 x' + mult + ' 🔥 +' + gained, true); }
      else if (mult === 2)        popText(good + '개 x2 +' + gained, true);
      else                        popText('냠! +' + gained);
    }
  }
  scoreFX(score - s0);
}

function setBandHint(txt) { const s = bandEl.firstElementChild; if (s) s.textContent = txt; }

// 한 입(=chomp)을 판정: MediaPipe 입벌림(jawOpen) 우선, 없으면 모션 폴백
function detectBite() {
  if (tapMode) { setBandHint('⌨️ 스페이스바 / 화면 탭으로 앙!' + (camBlockReason ? '  (' + camBlockReason + ')' : '')); return false; }
  if (window.__faceReady && !window.__faceFailed) {
    try { window.__detectFace(video, performance.now()); } catch (e) {}
    const jaw = window.__jawOpen || 0;
    if (jaw < JAW_CLOSED) armed = true;                 // 입을 다물면 재장전
    if (!window.__facePresent) setBandHint('🙂 얼굴이 안 보여요 — 화면 중앙으로!');
    else setBandHint(jaw > JAW_OPEN ? '앙! 🍔' : '👄 입을 크게 벌리세요!');
    if (armed && jaw > JAW_OPEN) { armed = false; return true; }  // 벌리는 순간 = 한 입
    return false;
  }
  // 폴백: 중앙 영역 모션 감지
  const m = motionInCenter();
  if (cooldown > 0) cooldown--;
  setBandHint(window.__faceFailed ? '👄 입 크게 벌렸다 앙!' : '⏳ 얼굴 인식 로딩 중…');
  if (m > 13 && cooldown === 0) { cooldown = 9; return true; }
  return false;
}

function loop() {
  if (!running) return;
  frame++;

  const bite = detectBite();

  // 햄버거 낙하 + 화면 갱신
  for (const d of drops) {
    if (d.eaten) continue;
    d.y += d.vy;
    d.el.style.top = d.y + '%';
    const hot = d.y >= BAND_TOP && d.y <= BAND_BOT;
    d.el.classList.toggle('hot', hot);
  }
  // 바닥으로 놓친 것 제거
  drops = drops.filter(d => {
    if (!d.eaten && d.y > 112) { d.el.remove(); return false; }
    return d.el.isConnected;
  });

  // 스폰: 시간이 갈수록 조금씩 자주 + 피버/막판 러시
  const feverOn = performance.now() < feverUntil;
  let spawnEvery = Math.max(40, 78 - (30 - timeLeft) * 1.1);  // 78 → 40 frame
  if (timeLeft <= 5) spawnEvery = 20;   // ⏰ 막판 러시!
  if (feverOn) spawnEvery = 9;          // 🔥 피버 타임: 햄버거 폭포
  if (frame % Math.round(spawnEvery) === 0) spawnDrop();
  stage.classList.toggle('fever', feverOn);
  feverEl.style.width = (feverOn ? 100 : fever) + '%';
  feverWrap.classList.toggle('full', feverOn || fever >= 75);
  feverWrap.querySelector('.flabel').textContent = feverOn ? 'FEVER TIME!!' : 'FEVER';

  if (bite) chomp();

  requestAnimationFrame(loop);
}

function tick() {
  if (!running) return;
  timeLeft--; timeEl.textContent = timeLeft;
  timePill.classList.toggle('hot', timeLeft <= 5 && timeLeft > 0);
  if (timeLeft <= 0) { endGame(); return; }
  setTimeout(tick, 1000);
}

function clearDrops() { for (const d of drops) d.el.remove(); drops = []; }

function endGame() {
  running = false; clearDrops();
  overlay.classList.remove('hidden');
  comboEl.classList.add('off');
  const grade = score >= 40 ? '🏆 전설의 대식가!' : score >= 25 ? '🔥 폭식 챔피언!' : score >= 12 ? '👍 훌륭한 먹방!' : '🙂 다음엔 더 많이!';
  let best = 0, isNewBest = false;
  try {
    best = +(localStorage.getItem('burgerBest') || 0);
    if (score > best) { isNewBest = true; best = score; localStorage.setItem('burgerBest', score); }
  } catch (e) {}
  overlay.innerHTML =
    '<h2>⏰ 끝!</h2>' +
    '<p>최종 점수 <b style="font-size:32px;color:#ffe66d">' + score + '점</b><br>' +
    '최고 콤보 🔥 <b>x' + Math.min(5, 1 + Math.floor(Math.max(0,bestStreak-1)/2)) + '</b> (' + bestStreak + '연속)<br>' +
    (isNewBest ? '✨ <b style="color:#ffd93d">신기록 달성!</b> ✨' : '최고 기록 🏆 ' + best + '점') + '<br>' + grade + '</p>' +
    '<button id="againBtn">🔄 다시 하기</button>' +
    (camPolicyBlocked ? '<a class="camtab" target="_blank" rel="noopener" href="' + location.href + '">📷 웹캠 입 인식 모드로 하려면? → 새 탭에서 열기</a>' : '');
  document.getElementById('againBtn').onclick = startGame;
}

async function startGame() {
  overlay.classList.add('hidden');
  // 오디오 컨텍스트는 클릭(사용자 제스처) 시점에 생성/재개
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e) { actx = null; }
  if (!stream) { const ok = await initCamera(); if (!ok) return; }
  clearDrops();
  score = 0; timeLeft = 30; cooldown = 0; frame = 0; prevFrame = null;
  streak = 0; bestStreak = 0; armed = true;
  fever = 0; feverUntil = 0; feverEl.style.width = '0%';
  shownScore = 0; scoreTween++;
  stage.classList.remove('fever'); timePill.classList.remove('hot');
  feverWrap.classList.remove('full'); feverBanner.classList.remove('show');
  scoreEl.textContent = '0'; timeEl.textContent = '30';
  comboEl.classList.add('off');
  running = true;
  loop(); tick();
}

// 수동 입력(카메라 없이도 플레이): 스페이스바 / 화면 탭
function manualBite() { if (running) chomp(); }
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) manualBite(); } });
stage.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; manualBite(); });

startBtn.onclick = startGame;

// iframe에서 카메라가 정책상 차단된 경우 → "새 탭에서 열기" 안내 표시
try {
  const inIframe = window.self !== window.top;
  const fp = document.featurePolicy || document.permissionsPolicy;
  const camAllowed = fp && fp.allowsFeature ? fp.allowsFeature('camera') : true;
  if (inIframe && !camAllowed) {
    camPolicyBlocked = true;
    const a = document.getElementById('camTabBtn');
    if (a) { a.href = location.href; a.classList.remove('hidden'); }
  }
} catch (e) {}
</script>

<!-- 얼굴 랜드마크(입 벌림) 인식: MediaPipe FaceLandmarker -->
<script type="module">
  window.__jawOpen = 0;
  window.__facePresent = false;
  window.__faceReady = false;
  window.__faceFailed = false;
  let landmarker = null, lastTs = -1;
  const V = "0.10.18";
  const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  try {
    const { FaceLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/wasm`);
    const make = (delegate) => FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL, delegate },
      outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1
    });
    try { landmarker = await make("GPU"); } catch (e) { landmarker = await make("CPU"); }
    window.__detectFace = (video, ts) => {
      if (!landmarker || ts <= lastTs || !video.videoWidth) return;
      lastTs = ts;
      const res = landmarker.detectForVideo(video, ts);
      if (res.faceBlendshapes && res.faceBlendshapes.length) {
        window.__facePresent = true;
        const jaw = res.faceBlendshapes[0].categories.find(c => c.categoryName === 'jawOpen');
        window.__jawOpen = jaw ? jaw.score : 0;
      } else {
        window.__facePresent = false; window.__jawOpen = 0;
      }
    };
    window.__faceReady = true;
    console.log('FaceLandmarker ready ✅');
  } catch (e) {
    window.__faceFailed = true;
    console.warn('FaceLandmarker 로드 실패 → 모션 폴백:', e);
  }
</script>
</body>
