<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 냠냠 햄버거 게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% 0%, #3a2a5a, #1a1030 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  h1 { font-size: 28px; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .subtitle { color: #b9a9dd; font-size: 14px; margin-bottom: 14px; }

  #stage {
    position: relative;
    width: 640px;
    max-width: 92vw;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    background: #000;
  }
  video, #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(-1); } /* 거울 모드 */

  /* 햄버거 */
  #burger {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.6));
    transition: transform .08s ease;
    pointer-events: none;
    z-index: 5;
  }
  #burger.chomp { animation: chomp .25s ease; }
  @keyframes chomp {
    0%   { transform: translate(-50%, -50%) scale(1); }
    40%  { transform: translate(-50%, -50%) scale(1.35) rotate(-8deg); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* 목표 링 (입 위치 가이드) */
  #ring {
    position: absolute;
    left: 50%; top: 50%;
    width: 180px; height: 180px;
    transform: translate(-50%, -50%);
    border: 3px dashed rgba(255,255,255,.35);
    border-radius: 50%;
    z-index: 4; pointer-events: none;
  }

  /* HUD */
  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    font-size: 18px; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    z-index: 6; pointer-events: none;
  }
  .pill { background: rgba(0,0,0,.4); padding: 6px 14px; border-radius: 999px; }

  #meterWrap {
    position: absolute; bottom: 14px; left: 14px; right: 14px;
    height: 14px; background: rgba(0,0,0,.4);
    border-radius: 999px; overflow: hidden; z-index: 6;
  }
  #meter { height: 100%; width: 0%; background: linear-gradient(90deg,#ffb347,#ff6b6b); transition: width .15s; }

  .float {
    position: absolute; z-index: 7; font-weight: 800; font-size: 28px;
    color: #ffe66d; text-shadow: 0 2px 6px rgba(0,0,0,.7);
    pointer-events: none; animation: floatUp .8s ease-out forwards;
  }
  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-70px); opacity: 0; }
  }

  #overlayMsg {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,10,40,.82); text-align: center; gap: 14px; padding: 20px;
  }
  #overlayMsg h2 { font-size: 40px; }
  #overlayMsg p { color: #cdbdf0; max-width: 420px; line-height: 1.6; }
  button {
    background: linear-gradient(90deg,#ff6b6b,#ffb347);
    color: #201035; border: none; font-weight: 800; font-size: 18px;
    padding: 14px 34px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,107,107,.4);
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }
  .hidden { display: none !important; }
  .tips { font-size: 13px; color: #9a89c4; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
  <h1>🍔 냠냠! 햄버거 먹방 게임</h1>
  <div class="subtitle">웹캠 앞에서 <b>입을 크게 벌렸다 오므리며</b> 햄버거를 먹어치우세요!</div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="ring"></div>
    <div id="burger">🍔</div>

    <div class="hud">
      <div class="pill">🍔 <span id="eaten">0</span>개</div>
      <div class="pill">⏱️ <span id="time">30</span>s</div>
    </div>
    <div id="meterWrap"><div id="meter"></div></div>

    <div id="overlayMsg">
      <h2>게임 준비</h2>
      <p>웹캠 사용을 허용해 주세요. 햄버거가 <b>위에서 아래로 떨어져요.</b> 중앙 원(입 위치)에 도착하면 잠깐 천천히 내려오니, 그때 입을 <b>크게 벌렸다 다물어</b> 냠냠 먹어치우세요!</p>
      <button id="startBtn">🎬 시작하기</button>
    </div>
  </div>

  <div class="tips">움직임이 클수록 한 입이 커져요 · 30초 동안 몇 개나 먹을 수 있을까요?</div>

<script>
const video   = document.getElementById('video');
const burger  = document.getElementById('burger');
const stage    = document.getElementById('stage');
const eatenEl  = document.getElementById('eaten');
const timeEl   = document.getElementById('time');
const meter    = document.getElementById('meter');
const overlay  = document.getElementById('overlayMsg');
const startBtn = document.getElementById('startBtn');

// 햄버거 진행 단계 이모지 (먹을수록 줄어듦)
const STAGES = ['🍔','🍔','🍔','🥪','🥪','🥯','🍞','😋'];

let stream = null;
let running = false;
let eatenCount = 0;
let timeLeft = 30;
let progress = 0;          // 현재 햄버거 먹은 정도 0~100
let cooldown = 0;

// 떨어지는 햄버거 위치(%). -12 = 화면 위, 115 = 화면 아래로 사라짐
let burgerY = -12;
const FALL_FAST = 0.55;    // 평소 낙하 속도
const FALL_SLOW = 0.10;    // 입 근처(먹는 구간)에서 느려짐
const ZONE_TOP = 40, ZONE_BOT = 62;  // 먹을 수 있는 구간(%)

// 모션 감지용 캔버스
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });
const W = 64, H = 48;      // 저해상도로 처리(빠름)
proc.width = W; proc.height = H;
let prevFrame = null;

async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    overlay.innerHTML = '<h2>😢 카메라를 열 수 없어요</h2><p>브라우저의 카메라 권한을 허용했는지 확인해 주세요. (macOS: 시스템 설정 → 개인정보 보호 → 카메라)</p>';
    overlay.classList.remove('hidden');
    return false;
  }
}

// 중앙 영역(입 위치)의 움직임량 측정
function motionInCenter() {
  pctx.save();
  pctx.scale(-1, 1);                 // 거울
  pctx.drawImage(video, -W, 0, W, H);
  pctx.restore();
  const cur = pctx.getImageData(0, 0, W, H).data;

  if (!prevFrame) { prevFrame = cur.slice(); return 0; }

  // 중앙 사각형 영역만 검사
  const x0 = W*0.28|0, x1 = W*0.72|0, y0 = H*0.30|0, y1 = H*0.80|0;
  let diff = 0, count = 0;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = (y*W + x) * 4;
      const d = Math.abs(cur[i]-prevFrame[i]) + Math.abs(cur[i+1]-prevFrame[i+1]) + Math.abs(cur[i+2]-prevFrame[i+2]);
      if (d > 45) count++;
      diff += d;
      count;
    }
  }
  prevFrame = cur.slice();
  const area = (x1-x0)*(y1-y0);
  return diff / area;                // 평균 픽셀 변화량
}

function popText(txt) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.left = (40 + Math.random()*40) + '%';
  el.style.top  = '38%';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function updateBurgerFace() {
  const idx = Math.min(STAGES.length - 2, Math.floor(progress / 100 * (STAGES.length - 1)));
  burger.textContent = STAGES[idx];
  meter.style.width = progress + '%';
}

// 새 햄버거를 화면 위에서 다시 떨어뜨림
function spawnBurger() {
  burgerY = -12;
  progress = 0;
  burger.textContent = '🍔';
  updateBurgerFace();
}

function loop() {
  if (!running) return;
  const m = motionInCenter();
  if (cooldown > 0) cooldown--;

  // 먹는 구간에 들어오면 천천히, 아니면 빠르게 낙하
  const inZone = burgerY >= ZONE_TOP && burgerY <= ZONE_BOT;
  burgerY += inZone ? FALL_SLOW : FALL_FAST;
  burger.style.top = burgerY + '%';

  // 아래로 놓쳐서 사라지면 새 햄버거 투하
  if (burgerY > 115) {
    popText('아까워! 🫠');
    spawnBurger();
    requestAnimationFrame(loop);
    return;
  }

  // 입 위치(구간)에 있을 때만, 움직임 임계치를 넘으면 "한 입"
  if (inZone && m > 14 && cooldown === 0) {
    const bite = Math.min(45, 8 + m * 0.9);   // 움직임 클수록 큰 한 입
    progress += bite;
    cooldown = 6;                              // 연속 인식 방지
    burger.classList.remove('chomp');
    void burger.offsetWidth;
    burger.classList.add('chomp');
    updateBurgerFace();

    if (progress >= 100) {
      // 한 개 완식!
      eatenCount++;
      eatenEl.textContent = eatenCount;
      popText('+1 😋');
      burger.textContent = '😋';
      cooldown = 12;
      setTimeout(() => { if (running) spawnBurger(); }, 300);  // 다음 햄버거 투하
    } else {
      popText('냠!');
    }
  }
  requestAnimationFrame(loop);
}

function tick() {
  if (!running) return;
  timeLeft--;
  timeEl.textContent = timeLeft;
  if (timeLeft <= 0) { endGame(); return; }
  setTimeout(tick, 1000);
}

function endGame() {
  running = false;
  overlay.classList.remove('hidden');
  overlay.innerHTML =
    '<h2>⏰ 끝!</h2>' +
    '<p>총 <b style="font-size:28px;color:#ffe66d">' + eatenCount + '개</b>의 햄버거를 먹었어요!<br>' +
    (eatenCount >= 8 ? '🏆 대식가 등극!' : eatenCount >= 4 ? '👍 훌륭한 먹방!' : '🙂 다음엔 더 많이!') + '</p>' +
    '<button id="againBtn">🔄 다시 하기</button>';
  document.getElementById('againBtn').onclick = startGame;
}

async function startGame() {
  overlay.classList.add('hidden');
  if (!stream) { const ok = await initCamera(); if (!ok) return; }
  eatenCount = 0; timeLeft = 30; progress = 0; cooldown = 0; prevFrame = null;
  eatenEl.textContent = '0'; timeEl.textContent = '30';
  spawnBurger();
  running = true;
  loop();
  tick();
}

startBtn.onclick = startGame;
</script>
</body>
</html>
