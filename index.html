<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 냠냠! 햄버거 폭우 - WEMADE PLAY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% 0%, #3a2a5a, #140a26 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    user-select: none;
  }
  .logo {
    height: 34px; width: auto; margin-bottom: 10px;
    background: #fff; padding: 8px 16px; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  h1 { font-size: 24px; margin-bottom: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .subtitle { color: #b9a9dd; font-size: 13px; margin-bottom: 12px; }

  #stage {
    position: relative;
    width: 640px;
    max-width: 94vw;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    background: #000;
  }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video { transform: scaleX(-1); }

  /* 떨어지는 햄버거 */
  .drop {
    position: absolute;
    font-size: 38px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.6));
    z-index: 5; pointer-events: none;
    transition: filter .1s;
    will-change: top, left;
  }
  .drop.hot { filter: drop-shadow(0 0 12px #ffe66d) drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .drop.gold { animation: sparkle .8s ease-in-out infinite; }
  .drop.gold.hot { filter: drop-shadow(0 0 16px #ffd93d) drop-shadow(0 0 6px #fff); }
  @keyframes sparkle {
    0%,100% { filter: drop-shadow(0 0 8px #ffd93d); }
    50%     { filter: drop-shadow(0 0 18px #fff) drop-shadow(0 0 8px #ffd93d); }
  }
  .drop.eaten { animation: eat .35s ease forwards; }
  @keyframes eat {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    40%  { transform: translate(-50%, -50%) scale(1.6) rotate(-12deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(.2); opacity: 0; }
  }

  /* 화면 흔들림 */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }
  #stage.shake { animation: shake .3s; }

  /* 콤보 표시 */
  #comboPill {
    background: linear-gradient(90deg,#ff6b6b,#ffb347);
    color: #201035; transition: transform .12s;
  }
  #comboPill.bump { transform: scale(1.35); }
  #comboPill.off { opacity: 0; }

  /* 입 높이 띠(먹는 구간) */
  #band {
    position: absolute; left: 0; right: 0;
    top: 42%; height: 20%;
    background: linear-gradient(180deg, rgba(255,230,109,.08), rgba(255,107,107,.14), rgba(255,230,109,.08));
    border-top: 2px dashed rgba(255,255,255,.35);
    border-bottom: 2px dashed rgba(255,255,255,.35);
    z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #band span { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.7); text-shadow: 0 1px 3px #000; }

  /* 티셔츠에 프린트된 로고 (흰 배경은 multiply로 날림) */
  #shirtLogo {
    position: absolute; left: 50%; top: 76%;
    width: 40%;
    transform: translate(-50%, -50%);
    mix-blend-mode: multiply;
    opacity: .95; filter: contrast(1.15);
    z-index: 3; pointer-events: none;
  }

  .hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 18px; font-weight: 800;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    z-index: 6; pointer-events: none;
  }
  .pill { background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 999px; }

  .float {
    position: absolute; z-index: 7; font-weight: 900;
    color: #ffe66d; text-shadow: 0 2px 8px rgba(0,0,0,.8);
    pointer-events: none; animation: floatUp 1s ease-out forwards;
    left: 50%; top: 50%; transform: translate(-50%,-50%); white-space: nowrap;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%,-50%) scale(.6); opacity: 0; }
    25%  { transform: translate(-50%,-90%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-180%) scale(1); opacity: 0; }
  }

  #overlayMsg {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,10,40,.85); text-align: center; gap: 14px; padding: 20px;
  }
  #overlayMsg .logo { height: 30px; margin-bottom: 4px; }
  #overlayMsg h2 { font-size: 38px; }
  #overlayMsg p { color: #cdbdf0; max-width: 440px; line-height: 1.6; }
  button {
    background: linear-gradient(90deg,#ff6b6b,#ffb347);
    color: #201035; border: none; font-weight: 800; font-size: 18px;
    padding: 14px 34px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,107,107,.4);
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }
  .hidden { display: none !important; }
  .tips { font-size: 13px; color: #9a89c4; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="WEMADE PLAY">
  <h1>🍔 햄버거 폭우!</h1>
  <div class="subtitle">하늘에서 쏟아지는 햄버거를 <b>입 높이 띠</b>에서 한 번에 앙! 많이 먹을수록 콤보!</div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="shirtLogo" src="logo.png" alt="">
    <div id="band"><span>👄 여기서 입 크게 벌렸다 앙! 하세요</span></div>

    <div class="hud">
      <div class="pill">🍔 <span id="score">0</span></div>
      <div class="pill off" id="comboPill">🔥 x1</div>
      <div class="pill">⏱️ <span id="time">30</span>s</div>
    </div>

    <div id="overlayMsg">
      <img class="logo" src="logo.png" alt="WEMADE PLAY">
      <h2>햄버거 폭우 🍔</h2>
      <p>웹캠을 허용해 주세요. 하늘에서 음식이 떨어져요. 노란 <b>입 높이 띠</b>에서 입을 <b>크게 벌렸다 다물면</b> 그 안의 음식을 한 번에 다 먹어요.<br><b>🍔 햄버거 = +점</b>, 🍟🌭🍕🌮 <b>다른 음식 = -점!</b><br>연속으로 햄버거만 먹으면 <b>🔥콤보 배수(최대 x5)</b>, 가끔 떨어지는 <b>⭐별은 보너스(+5)</b>!</p>
      <button id="startBtn">🎬 시작하기</button>
    </div>
  </div>

  <div class="tips">한 번에 여러 개 먹으면 콤보 보너스 · 30초 동안 최대한 많이!</div>

<script>
const video   = document.getElementById('video');
const stage   = document.getElementById('stage');
const bandEl  = document.getElementById('band');
const scoreEl = document.getElementById('score');
const timeEl  = document.getElementById('time');
const comboEl = document.getElementById('comboPill');
const overlay = document.getElementById('overlayMsg');
const startBtn= document.getElementById('startBtn');

const BURGERS = ['🍔','🍔','🍔','🍔','🍔','🍔','🍔','🍟','🌭','🍕','🌮'];
const BAND_TOP = 42, BAND_BOT = 62;   // 먹는 구간(%)

let stream = null, running = false;
let score = 0, timeLeft = 30;
let cooldown = 0, frame = 0;
let streak = 0, bestStreak = 0;
let drops = [];   // {el, x, y, vy, eaten, type}

// 효과음 (Web Audio로 즉석 생성)
let actx = null;
function sfx(type) {
  if (!actx) return;
  const t = actx.currentTime;
  const beep = (freq, f2, dur, wave, vol) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  if (type === 'chomp') beep(200, 70, 0.13, 'square', 0.22);
  else if (type === 'coin') { beep(880, null, 0.08, 'triangle', 0.2); setTimeout(()=>actx&&beep(1320,null,0.12,'triangle',0.18), 60); }
  else if (type === 'bad')  beep(150, 45, 0.32, 'sawtooth', 0.25);
  else if (type === 'star') [660,880,1100,1320].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain(), st=t+i*0.05;
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.18, st); g.gain.exponentialRampToValueAtTime(0.001, st+0.16);
    o.connect(g).connect(actx.destination); o.start(st); o.stop(st+0.18);
  });
}
function shake() { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
function updateCombo() {
  const mult = multiplier();
  comboEl.textContent = '🔥 x' + mult;
  comboEl.classList.toggle('off', streak < 1);
  comboEl.classList.add('bump');
  setTimeout(() => comboEl.classList.remove('bump'), 130);
}
function multiplier() { return Math.min(5, 1 + Math.floor(Math.max(0, streak - 1) / 2)); } // 1,1,2,2,3,3,4,4,5

// 모션 감지
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });
const W = 64, H = 48; proc.width = W; proc.height = H;
let prevFrame = null;

async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play(); return true;
  } catch (e) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = '<h2>😢 카메라를 열 수 없어요</h2><p>브라우저의 카메라 권한을 허용했는지 확인해 주세요.</p>';
    return false;
  }
}

function motionInCenter() {
  pctx.save(); pctx.scale(-1, 1); pctx.drawImage(video, -W, 0, W, H); pctx.restore();
  const cur = pctx.getImageData(0, 0, W, H).data;
  if (!prevFrame) { prevFrame = cur.slice(); return 0; }
  const x0 = W*0.28|0, x1 = W*0.72|0, y0 = H*0.30|0, y1 = H*0.80|0;
  let diff = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = (y*W + x) * 4;
    diff += Math.abs(cur[i]-prevFrame[i]) + Math.abs(cur[i+1]-prevFrame[i+1]) + Math.abs(cur[i+2]-prevFrame[i+2]);
  }
  prevFrame = cur.slice();
  return diff / ((x1-x0)*(y1-y0));
}

function popText(txt, big, bad) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.fontSize = big ? '40px' : '26px';
  el.style.color = bad ? '#ff6b6b' : '#ffe66d';
  el.style.top = (30 + Math.random()*10) + '%';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function spawnDrop() {
  const el = document.createElement('div');
  el.className = 'drop';
  let type;
  if (Math.random() < 0.07) { el.textContent = '⭐'; el.classList.add('gold'); type = 'gold'; }  // 황금 별 보너스
  else { const e = BURGERS[Math.random()*BURGERS.length|0]; el.textContent = e; type = (e === '🍔') ? 'good' : 'bad'; }
  const x = 8 + Math.random()*84;        // 좌우 위치 %
  el.style.left = x + '%';
  el.style.top = '-8%';
  stage.appendChild(el);
  drops.push({ el, x, y: -8, vy: 0.32 + Math.random()*0.34, eaten: false, type });
}

function chomp() {
  // 띠 안에 있는(아직 안 먹은) 음식을 전부 먹기 — 🍔 +, ⭐ 보너스, 나머지 -
  let good = 0, bad = 0, gold = 0;
  for (const d of drops) {
    if (!d.eaten && d.y >= BAND_TOP && d.y <= BAND_BOT) {
      d.eaten = true;
      if (d.type === 'good') good++;
      else if (d.type === 'gold') gold++;
      else bad++;
      d.el.classList.add('eaten');
      setTimeout(() => d.el.remove(), 350);
    }
  }
  if (good === 0 && bad === 0 && gold === 0) return;

  const base = good + gold * 5;   // 별은 5점짜리

  if (bad > 0) {
    // 실수! 콤보 리셋 + 감점
    streak = 0;
    score += base - bad;
    sfx('bad'); shake(); updateCombo();
    if (good === 0 && gold === 0) popText('-' + bad + ' 🤢 우엑!', true, true);
    else                          popText('+' + base + '  -' + bad + ' 😵', true, bad >= base);
  } else {
    // 성공! 콤보 상승 → 배수 적용
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    const mult = multiplier();
    const gained = base * mult;
    score += gained;
    updateCombo();
    if (gold > 0) { sfx('star'); shake(); popText('⭐ +' + gained + ' 보너스!', true); }
    else {
      sfx('chomp'); if (mult >= 2) sfx('coin');
      if (mult >= 3 || good >= 3) { shake(); popText(good + '개 x' + mult + ' 🔥 +' + gained, true); }
      else if (mult === 2)        popText(good + '개 x2 +' + gained, true);
      else                        popText('냠! +' + gained);
    }
  }
  scoreEl.textContent = score;
}

function loop() {
  if (!running) return;
  frame++;
  const m = motionInCenter();
  if (cooldown > 0) cooldown--;

  // 햄버거 낙하 + 화면 갱신
  for (const d of drops) {
    if (d.eaten) continue;
    d.y += d.vy;
    d.el.style.top = d.y + '%';
    const hot = d.y >= BAND_TOP && d.y <= BAND_BOT;
    d.el.classList.toggle('hot', hot);
  }
  // 바닥으로 놓친 것 제거
  drops = drops.filter(d => {
    if (!d.eaten && d.y > 112) { d.el.remove(); return false; }
    return d.el.isConnected;
  });

  // 스폰: 시간이 갈수록 조금씩 자주 (전체적으로 여유롭게)
  const spawnEvery = Math.max(40, 78 - (30 - timeLeft) * 1.1);  // 78 → 40 frame
  if (frame % Math.round(spawnEvery) === 0) spawnDrop();

  // 입 움직임 감지 → 한 입(띠 안 전부)
  if (m > 13 && cooldown === 0) { chomp(); cooldown = 9; }

  requestAnimationFrame(loop);
}

function tick() {
  if (!running) return;
  timeLeft--; timeEl.textContent = timeLeft;
  if (timeLeft <= 0) { endGame(); return; }
  setTimeout(tick, 1000);
}

function clearDrops() { for (const d of drops) d.el.remove(); drops = []; }

function endGame() {
  running = false; clearDrops();
  overlay.classList.remove('hidden');
  comboEl.classList.add('off');
  const grade = score >= 40 ? '🏆 전설의 대식가!' : score >= 25 ? '🔥 폭식 챔피언!' : score >= 12 ? '👍 훌륭한 먹방!' : '🙂 다음엔 더 많이!';
  overlay.innerHTML =
    '<img class="logo" src="logo.png" alt="WEMADE PLAY">' +
    '<h2>⏰ 끝!</h2>' +
    '<p>최종 점수 <b style="font-size:32px;color:#ffe66d">' + score + '점</b><br>' +
    '최고 콤보 🔥 <b>x' + Math.min(5, 1 + Math.floor(Math.max(0,bestStreak-1)/2)) + '</b> (' + bestStreak + '연속)<br>' + grade + '</p>' +
    '<button id="againBtn">🔄 다시 하기</button>';
  document.getElementById('againBtn').onclick = startGame;
}

async function startGame() {
  overlay.classList.add('hidden');
  // 오디오 컨텍스트는 클릭(사용자 제스처) 시점에 생성/재개
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e) { actx = null; }
  if (!stream) { const ok = await initCamera(); if (!ok) return; }
  clearDrops();
  score = 0; timeLeft = 30; cooldown = 0; frame = 0; prevFrame = null;
  streak = 0; bestStreak = 0;
  scoreEl.textContent = '0'; timeEl.textContent = '30';
  comboEl.classList.add('off');
  running = true;
  loop(); tick();
}

startBtn.onclick = startGame;
</script>
</body>
</html>
